# Render Blueprint: New → Blueprint → pick this repo. You'll be asked for the two secrets.
services:
  - type: web
    name: resume-tailor
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /healthz
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: APP_PASSWORD
        sync: false
